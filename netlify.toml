[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.19.0"

[dev]
  command = "pnpm dev"
  port = 3000
  targetPort = 3000

[context.deploy-preview.environment]
  REALME_ENVIRONMENT = "preview"
  REALME_DATA_CLASSIFICATION = "synthetic"

[context.branch-deploy.environment]
  REALME_ENVIRONMENT = "staging"
  REALME_DATA_CLASSIFICATION = "synthetic"

[context.production.environment]
  REALME_ENVIRONMENT = "production"
  REALME_DATA_CLASSIFICATION = "personal"

# Netlify applies its maintained OpenNext adapter automatically. Do not pin the
# legacy @netlify/plugin-nextjs package without a recorded compatibility reason.
