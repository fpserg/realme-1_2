[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.19.0"

[dev]
  command = "pnpm dev"
  port = 3000
  targetPort = 3000

[context.deploy-preview.environment]
  REALME_ENVIRONMENT = "preview"
  REALME_DATA_CLASSIFICATION = "synthetic"
  REALME_DIALOGUE_PROVIDER = "openai"
  REALME_DIALOGUE_MODEL = "gpt-5.4-mini-2026-03-17"
  REALME_INTERPRETATION_PROVIDER = "openai"
  REALME_INTERPRETATION_MODEL = "gpt-5.4-mini-2026-03-17"

[context.branch-deploy.environment]
  REALME_ENVIRONMENT = "staging"
  REALME_DATA_CLASSIFICATION = "synthetic"
  REALME_DIALOGUE_PROVIDER = "openai"
  REALME_DIALOGUE_MODEL = "gpt-5.4-mini-2026-03-17"
  REALME_INTERPRETATION_PROVIDER = "openai"
  REALME_INTERPRETATION_MODEL = "gpt-5.4-mini-2026-03-17"

[context.production.environment]
  REALME_ENVIRONMENT = "production"
  REALME_DATA_CLASSIFICATION = "personal"

# Netlify applies its maintained OpenNext adapter automatically. Do not pin the
# legacy @netlify/plugin-nextjs package without a recorded compatibility reason.
