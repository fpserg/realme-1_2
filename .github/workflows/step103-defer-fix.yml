name: Step 103 defer fix

on:
  push:
    branches:
      - agent/step-103-admission-versioned-world-model

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/step-103-admission-versioned-world-model
          fetch-depth: 1
      - name: Restore first-defer replay flag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260828104500_step_103_admission_versioned_world_model.sql')
          s = p.read_text()
          old = """    RETURN QUERY SELECT p_candidate_claim_id, v_decision_id, 'defer'::text,
              NULL::uuid, NULL::uuid, NULL::uuid, true;
            RETURN;
          END IF;

          IF p_action = 'correct' THEN"""
          new = """    RETURN QUERY SELECT p_candidate_claim_id, v_decision_id, 'defer'::text,
              NULL::uuid, NULL::uuid, NULL::uuid, false;
            RETURN;
          END IF;

          IF p_action = 'correct' THEN"""
          if old not in s:
              raise SystemExit('target defer branch not found exactly once')
          if s.count(old) != 1:
              raise SystemExit('target defer branch is ambiguous')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260828104500_step_103_admission_versioned_world_model.sql
          git rm .github/workflows/step103-defer-fix.yml
          git commit -m "Restore first-defer replay semantics"
          git push origin HEAD:agent/step-103-admission-versioned-world-model
