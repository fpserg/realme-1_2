name: Step 103 metadata generator

on:
  push:
    branches:
      - agent/step-103-admission-versioned-world-model

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/step-103-admission-versioned-world-model
          fetch-depth: 1
      - name: Generate linked custom-migration snapshot
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = 'supabase/migrations/meta/20260827130916_snapshot.json';
          const target = 'supabase/migrations/meta/20260828104500_snapshot.json';
          const prior = JSON.parse(fs.readFileSync(source, 'utf8'));
          const next = {
            ...prior,
            id: '07e4305f-1918-4394-bf5b-046258480ff0',
            prevId: prior.id,
          };
          fs.writeFileSync(target, `${JSON.stringify(next, null, 2)}\n`);
          NODE
      - name: Commit artifact and remove generator
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/meta/20260828104500_snapshot.json
          git rm .github/workflows/step103-metadata-generator.yml
          git commit -m "Add linked Step 103 Drizzle snapshot"
          git push origin HEAD:agent/step-103-admission-versioned-world-model
