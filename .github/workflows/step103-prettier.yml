name: Step 103 formatter

on:
  push:
    branches:
      - agent/step-103-admission-versioned-world-model

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/step-103-admission-versioned-world-model
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Activate pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact Step 103 correction files
        run: >-
          pnpm exec prettier --write
          src/app/candidate-review.test.tsx
          src/app/candidate-review.tsx
          src/infrastructure/supabase/step-103-admission-contract.test.ts
          supabase/migrations/meta/20260828104500_snapshot.json
      - name: Commit formatter output and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/candidate-review.test.tsx src/app/candidate-review.tsx src/infrastructure/supabase/step-103-admission-contract.test.ts supabase/migrations/meta/20260828104500_snapshot.json
          git rm .github/workflows/step103-prettier.yml
          git commit -m "Format Step 103 correction files"
          git push origin HEAD:agent/step-103-admission-versioned-world-model
