name: Refresh PostCSS security lock

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Audit complete dependency graph
        run: pnpm audit:security

      - name: Commit generated lockfile to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "Refresh lockfile for PostCSS 8.5.23"
            git push origin HEAD:${{ github.head_ref }}
          fi
