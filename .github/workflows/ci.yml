name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit complete dependency graph
        run: pnpm audit:security

      - name: Verify environment-secret exclusions
        run: |
          git check-ignore --no-index --quiet .env.production
          git check-ignore --no-index --quiet .env.development
          git check-ignore --no-index --quiet .env.test
          if git check-ignore --no-index --quiet .env.example; then
            echo ".env.example must remain tracked"
            exit 1
          fi

      - name: Format correction sources
        run: pnpm exec prettier --write src/app/api/e2e-integrated-admission/route.ts src/app/candidate-review.tsx src/app/canonical-understanding.tsx src/app/e2e-integrated/page.tsx src/app/page.module.css src/app/page.tsx src/infrastructure/supabase/canonical-understanding-repository.ts tests/e2e/foundation.spec.ts

      - name: Package formatted correction sources
        run: |
          mkdir -p /tmp/step106-formatted
          cp --parents src/app/api/e2e-integrated-admission/route.ts src/app/candidate-review.tsx src/app/canonical-understanding.tsx src/app/e2e-integrated/page.tsx src/app/page.module.css src/app/page.tsx src/infrastructure/supabase/canonical-understanding-repository.ts tests/e2e/foundation.spec.ts /tmp/step106-formatted/

      - name: Upload formatted correction sources
        uses: actions/upload-artifact@v4
        with:
          name: step106-formatted
          path: /tmp/step106-formatted

      - name: Stop formatter probe
        run: exit 1
