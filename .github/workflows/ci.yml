name: CI

on:
  push:
    branches:
      - "agent/step-106-integrated-perceivable-experience"

permissions:
  contents: write

jobs:
  format-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/step-106-integrated-perceivable-experience
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --write scripts/step-106-boundary.test.mjs src/app/page.test.tsx
          if git diff --quiet -- scripts/step-106-boundary.test.mjs src/app/page.test.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/step-106-boundary.test.mjs src/app/page.test.tsx
          git commit -m "Format Step 106 correction tests"
          git push origin HEAD:agent/step-106-integrated-perceivable-experience
