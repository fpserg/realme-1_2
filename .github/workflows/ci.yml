name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify control-plane tests
        run: pnpm exec vitest run scripts/step-107-sergey-pilot.test.mjs scripts/step-107-control-plane.test.mjs

      - name: Clone pinned historical source
        run: |
          git clone https://github.com/fpserg/RealMe.git /tmp/RealMe
          test "$(git -C /tmp/RealMe rev-parse --verify b701e303e0e716dd54099938fab092d419d30e61^{commit})" = "b701e303e0e716dd54099938fab092d419d30e61"
          test "$(git -C /tmp/RealMe show -s --format=%T b701e303e0e716dd54099938fab092d419d30e61)" = "b5b3edd5d31cc1a4955a493ad0d9dd8948550d88"

      - name: Generate exact staging SQL artifact
        run: |
          node scripts/run-step-107-sergey-pilot.mjs \
            --source-root=/tmp/RealMe \
            --control-plane-sql \
            --world-id=8a507667-b771-45ec-aaa6-cec3eb4c4f39 \
            --account-id=10700000-0000-4000-8000-000000000001 \
            > /tmp/step107-staging.sql
          test "$(grep -c '^DO \$step107\$$' /tmp/step107-staging.sql)" = "1"
          sha256sum /tmp/step107-staging.sql

      - name: Upload exact staging SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: step107-staging-sql
          path: /tmp/step107-staging.sql
