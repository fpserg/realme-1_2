name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TEMP render formatting
        run: |
          pnpm exec prettier --write scripts/step-107-control-plane.mjs scripts/step-107-control-plane.test.mjs
          echo FORMAT_BUILDER_BEGIN
          base64 -w0 scripts/step-107-control-plane.mjs
          echo
          echo FORMAT_BUILDER_END
          echo FORMAT_TEST_BEGIN
          base64 -w0 scripts/step-107-control-plane.test.mjs
          echo
          echo FORMAT_TEST_END
          exit 1
