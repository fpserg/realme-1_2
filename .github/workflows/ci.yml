name: CI

on:
  push:
    branches:
      - "agent/step-106-integrated-perceivable-experience"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Step 106 branch
        uses: actions/checkout@v6
        with:
          ref: agent/step-106-integrated-perceivable-experience

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only Step 106 correction files
        run: pnpm exec prettier --write src/app/api/e2e-integrated-admission/route.ts src/app/candidate-review.tsx src/app/canonical-understanding.tsx src/app/e2e-integrated/page.tsx src/app/page.module.css src/app/page.tsx src/infrastructure/supabase/canonical-understanding-repository.ts tests/e2e/foundation.spec.ts

      - name: Commit bounded formatter result
        run: |
          if git diff --quiet -- src/app/api/e2e-integrated-admission/route.ts src/app/candidate-review.tsx src/app/canonical-understanding.tsx src/app/e2e-integrated/page.tsx src/app/page.module.css src/app/page.tsx src/infrastructure/supabase/canonical-understanding-repository.ts tests/e2e/foundation.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/e2e-integrated-admission/route.ts src/app/candidate-review.tsx src/app/canonical-understanding.tsx src/app/e2e-integrated/page.tsx src/app/page.module.css src/app/page.tsx src/infrastructure/supabase/canonical-understanding-repository.ts tests/e2e/foundation.spec.ts
          git commit -m "Apply exact Step 106 formatting"
          git push origin HEAD:agent/step-106-integrated-perceivable-experience
