name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit complete dependency graph
        run: pnpm audit:security

      - name: Verify environment-secret exclusions
        run: |
          git check-ignore --no-index --quiet .env.production
          git check-ignore --no-index --quiet .env.development
          git check-ignore --no-index --quiet .env.test
          if git check-ignore --no-index --quiet .env.example; then
            echo ".env.example must remain tracked"
            exit 1
          fi

      - name: Verify formatting
        run: |
          pnpm exec prettier --write src/app/page.module.css src/app/page.tsx tests/e2e/foundation.spec.ts
          git diff -- src/app/page.module.css src/app/page.tsx tests/e2e/foundation.spec.ts
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Verify architecture boundaries
        run: pnpm check:boundaries

      - name: Verify Drizzle migration artifacts
        run: pnpm db:check

      - name: Run unit and component tests
        run: pnpm test:unit

      - name: Build production application
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mobile smoke test
        run: pnpm test:e2e
