name: Step 107 Phase 4H Supplemental Execution Gate

on:
  push:
    branches:
      - agent/step-107-phase-4h-execution-gate
    paths:
      - .github/workflows/step-107-phase-4h-execution-gate.yml

permissions:
  contents: read

jobs:
  phase-4h-format-normalization:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable Step 107 Phase 4H head
        uses: actions/checkout@v4
        with:
          ref: 7410f9d31c723eda7df60313159d25fb233eca15
          persist-credentials: false

      - name: Prove immutable target identity
        run: |
          test "$(git rev-parse HEAD)" = "7410f9d31c723eda7df60313159d25fb233eca15"
          test "$(git rev-parse 'HEAD^{tree}')" = "33ba76566e88af09ab15d118f7e57749b06fc2af"
          test "$(git rev-parse HEAD:pnpm-lock.yaml)" = "733da16a0a446f06befe2d4a6a76d51c7723d09c"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Normalize touched source with repository Prettier
        run: pnpm exec prettier --write src/application/interpretation/interpret-observation.ts src/application/interpretation/interpret-observation.test.ts src/infrastructure/postgres/interpretation-job-repository.ts src/infrastructure/db/schema/operations.ts scripts/step-107-version-authority.test.mjs
      - name: Emit normalized files
        uses: actions/upload-artifact@v4
        with:
          name: phase-4h-prettier-normalized
          path: |
            src/application/interpretation/interpret-observation.ts
            src/application/interpretation/interpret-observation.test.ts
            src/infrastructure/postgres/interpretation-job-repository.ts
            src/infrastructure/db/schema/operations.ts
            scripts/step-107-version-authority.test.mjs
