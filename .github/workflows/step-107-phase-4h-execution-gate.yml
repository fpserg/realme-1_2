name: Step 107 Phase 4H Supplemental Execution Gate

on:
  push:
    branches:
      - agent/step-107-phase-4h-execution-gate
    paths:
      - .github/workflows/step-107-phase-4h-execution-gate.yml

permissions:
  contents: read

jobs:
  phase-4h-drizzle-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec2e9e7cd330e647b126d8e3be04049d7fd5133e
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "ec2e9e7cd330e647b126d8e3be04049d7fd5133e"
          test "$(git rev-parse 'HEAD^{tree}')" = "6c7656d26a90e448f08714e2247ea52dc3678fdb"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Generate Drizzle artifacts from Phase 4H schema
        run: pnpm db:generate
      - name: Report generated delta
        run: git status --short supabase/migrations
      - name: Emit generated migration metadata
        uses: actions/upload-artifact@v4
        with:
          name: phase-4h-drizzle-generated
          path: supabase/migrations
