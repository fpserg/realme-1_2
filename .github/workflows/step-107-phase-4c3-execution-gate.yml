name: Step 107 Phase 4C3 Supplemental Execution Gate

# Supplemental execution evidence only. This workflow does not alter, waive,
# suppress, or reinterpret the canonical dependency-security audit failure.
on:
  push:
    branches:
      - agent/step-107-phase-4c3-execution-gate
    paths:
      - .github/workflows/step-107-phase-4c3-execution-gate.yml

permissions:
  contents: read

jobs:
  phase-4c3-minimal-execution-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable approved Step 107 head
        uses: actions/checkout@v4
        with:
          ref: 1bfc7ec44073e86b064755ee4d493374e1f31347
          persist-credentials: false

      - name: Prove immutable target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1bfc7ec44073e86b064755ee4d493374e1f31347"
          test "$(git rev-parse 'HEAD^{tree}')" = "5724999b636e7ee048b7fc0a3108a1ae661b4250"
          test "$(git rev-parse HEAD:pnpm-lock.yaml)" = "733da16a0a446f06befe2d4a6a76d51c7723d09c"
          git status --short
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "LOCKFILE_BLOB=$(git rev-parse HEAD:pnpm-lock.yaml)"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm 11.19.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Report tool versions
        run: |
          node --version
          pnpm --version

      - name: Install unchanged frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run focused repository test
        run: pnpm exec vitest run src/infrastructure/postgres/interpretation-job-repository.test.ts

      - name: Run focused dispatch route test
        run: pnpm exec vitest run src/app/api/internal/interpretation/dispatch/route.test.ts

      - name: Run repository TypeScript validation
        run: pnpm typecheck

      - name: Confirm checkout remained clean
        run: |
          test -z "$(git status --short)"
          git status --short
